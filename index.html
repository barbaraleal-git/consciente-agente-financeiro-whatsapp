<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML --><!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      // Redirecionamento único do domínio antigo para o domínio oficial.
      // Dispara SOMENTE quando o hostname é exatamente consciente.goskip.app:
      // não afeta preview (*--preview.goskip.app), localhost/127.0.0.1 nem
      // consciente.net.br (sem loop). Preserva pathname + query + hash e usa
      // location.replace para não poluir o histórico. Roda uma vez, na entrada.
      (function () {
        try {
          if (window.location.hostname === "consciente.goskip.app") {
            window.location.replace(
              "https://consciente.net.br" +
                window.location.pathname +
                window.location.search +
                window.location.hash,
            );
          }
        } catch (e) {
          /* nunca bloquear o carregamento do app */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon = arquivo REAL do logo oficial (sem nome). Enquanto o arquivo não
         existir em public/brand/, o navegador mantém o favicon padrão do app. -->
    <link rel="icon" type="image/jpeg" href="/brand/Logo_Oficial_Consciente.jpg" />
    <title>Consciente - Seu Parceiro nas Finanças</title>
    <meta
      name="description"
      content="Consciente - Seu parceiro nas finanças. Agente financeiro inteligente via WhatsApp e Web para controle diário de custos e caixinhas."
    />
    <meta name="author" content="Consciente" />
    <meta property="og:title" content="Consciente - Seu parceiro nas finanças" />
    <meta
      property="og:description"
      content="Controle diário de custos e caixinhas pelo WhatsApp e Web."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="keywords" content="consciente,controle,financeiro,finanças" />
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
